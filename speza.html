<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛒 Agent Speza — Oferte Supermarketuri Ivrea</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0f1117; color:#e0e0e0; min-height:100vh; }
.header { background:linear-gradient(135deg,#1a1f2e,#2d1f3e); padding:20px; text-align:center; border-bottom:2px solid #4a3f6b; }
.header h1 { font-size:24px; margin-bottom:4px; }
.header .subtitle { color:#888; font-size:13px; }
.header .updated { color:#6a9; font-size:12px; margin-top:4px; }
.controls { display:flex; flex-wrap:wrap; gap:10px; padding:15px 20px; background:#1a1d27; border-bottom:1px solid #2a2d37; }
.controls select, .controls input { background:#2a2d37; color:#e0e0e0; border:1px solid #3a3d47; border-radius:6px; padding:8px 12px; font-size:14px; }
.controls input { flex:1; min-width:200px; }
.controls select { cursor:pointer; }
.stats-bar { display:flex; flex-wrap:wrap; gap:12px; padding:12px 20px; background:#15171f; border-bottom:1px solid #222; font-size:13px; }
.stat-pill { background:#2a2d37; padding:6px 14px; border-radius:20px; color:#aaa; }
.stat-pill strong { color:#7b9fc4; }
.stat-pill .count { color:#e0c060; font-weight:bold; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; padding:20px; }
.card { background:#1a1d27; border:1px solid #2a2d37; border-radius:10px; padding:14px; transition:border-color 0.2s; }
.card:hover { border-color:#4a5d7a; }
.card .mag { font-size:12px; color:#7b9fc4; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
.card .product { font-size:15px; color:#e0e0e0; margin-bottom:6px; line-height:1.3; }
.card .price { font-size:20px; color:#e0c060; font-weight:bold; }
.card .unit { font-size:12px; color:#888; margin-left:4px; }
.card .cat { display:inline-block; font-size:10px; padding:2px 8px; border-radius:10px; margin-top:6px; text-transform:uppercase; }
.cat-alimente { background:#1e3a1e; color:#6abf6a; }
.cat-casa { background:#3a2a1e; color:#bf9a6a; }
.cat-cafea { background:#2a1e3a; color:#9a7abf; }
.cat-bricolaj { background:#3a1e1e; color:#bf6a6a; }
.cat-altele { background:#2a2a2a; color:#999; }
.empty { text-align:center; padding:40px; color:#555; }
.footer { text-align:center; padding:20px; color:#444; font-size:12px; }
@media(max-width:600px){ .grid { grid-template-columns:1fr; } .controls { flex-direction:column; } }
</style>
</head>
<body>
<div class="header">
  <h1>🛒 Agent Speza</h1>
  <div class="subtitle">Oferte supermarketuri zona Ivrea</div>
  <div class="updated" id="updated"></div>
</div>
<div class="controls">
  <select id="filterMag" onchange="render()">
    <option value="">Toate magazinele</option>
  </select>
  <select id="filterCat" onchange="render()">
    <option value="">Toate categoriile</option>
  </select>
  <select id="sortBy" onchange="render()">
    <option value="price-asc">Preț crescător</option>
    <option value="price-desc">Preț descrescător</option>
    <option value="mag">Pe magazine</option>
  </select>
  <input type="text" id="search" placeholder="🔍 Caută produs..." oninput="render()">
</div>
<div class="stats-bar" id="stats"></div>
<div class="grid" id="grid"></div>
<div class="footer">Agent Speza 🛒 — SmartLola · Date din smartlola.db</div>

<script>
let DATA = null;
async function loadData(){
  try {
    const r = await fetch('speza-data.json');
    DATA = await r.json();
  } catch(e){
    document.getElementById('grid').innerHTML = '<div class="empty">⚠️ Nu pot încărca datele. Rulează speza-agent-v4.py întâi.</div>';
    return;
  }
  const mags = [...new Set(DATA.offers.map(o=>o.magazine))].sort();
  const cats = [...new Set(DATA.offers.map(o=>o.category))].sort();
  const selMag = document.getElementById('filterMag');
  mags.forEach(m => { const o=document.createElement('option'); o.value=m; o.textContent=m; selMag.appendChild(o); });
  const selCat = document.getElementById('filterCat');
  cats.forEach(c => { const o=document.createElement('option'); o.value=c; o.textContent=c; selCat.appendChild(o); });
  document.getElementById('updated').textContent = 'Actualizat: ' + new Date(DATA.offers[0]?.fetched_at || '').toLocaleString('ro-RO');
  render();
}
function render(){
  if(!DATA) return;
  const mag = document.getElementById('filterMag').value;
  const cat = document.getElementById('filterCat').value;
  const sort = document.getElementById('sortBy').value;
  const q = document.getElementById('search').value.toLowerCase();
  let offers = DATA.offers.filter(o => {
    if(mag && o.magazine !== mag) return false;
    if(cat && o.category !== cat) return false;
    if(q && !o.product.toLowerCase().includes(q)) return false;
    return true;
  });
  if(sort==='price-asc') offers.sort((a,b)=>a.price-b.price);
  else if(sort==='price-desc') offers.sort((a,b)=>b.price-a.price);
  else if(sort==='mag') offers.sort((a,b)=>a.magazine.localeCompare(b.magazine)||a.price-b.price);
  // Stats
  document.getElementById('stats').innerHTML = 
    `<span class="stat-pill">Total oferte: <span class="count">${offers.length}</span></span>` +
    `<span class="stat-pill">Magazine: <strong>${new Set(offers.map(o=>o.magazine)).size}</strong></span>` +
    `<span class="stat-pill">Preț minim: <strong>€${Math.min(...offers.map(o=>o.price)).toFixed(2)}</strong></span>` +
    `<span class="stat-pill">Preț maxim: <strong>€${Math.max(...offers.map(o=>o.price)).toFixed(2)}</strong></span>`;
  // Grid
  const grid = document.getElementById('grid');
  if(offers.length === 0){
    grid.innerHTML = '<div class="empty">Nicio ofertă găsită.</div>';
    return;
  }
  grid.innerHTML = offers.map(o => `
    <div class="card">
      <div class="mag">${o.magazine}</div>
      <div class="product">${o.product}</div>
      <div><span class="price">€${o.price.toFixed(2)}</span><span class="unit">${o.unit || ''}</span></div>
      <div class="cat cat-${o.category}">${o.category}</div>
    </div>
  `).join('');
}
loadData();
</script>
</body>
</html>
